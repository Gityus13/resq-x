<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | RESQ-X</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<style>
  html{background:#000}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#000;color:#f5f5f3;
       font:400 1.0625rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:34em}
  h1{margin:0 0 12px;font-size:2rem;line-height:1.15}
  p{margin:0 0 24px;color:#a3a3a8}
  a{display:inline-block;padding:.7em 1.3em;background:#f5f5f3;color:#000;font-weight:600;text-decoration:none}
  a:focus-visible{outline:2px solid #ff6a1a;outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>That page doesn't exist. The RESQ-X project page is on the home page.</p>
  <a id="home" href="/">Go to the RESQ-X home page</a>
</main>
<script>
  // On GitHub Pages project sites the site lives under /<repo>/, so point back there.
  (function () {
    var seg = location.pathname.split('/')[1];
    if (/\.github\.io$/.test(location.hostname) && seg) {
      document.getElementById('home').href = '/' + seg + '/';
    }
  })();
</script>
</body>
</html>
